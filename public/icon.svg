<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="fg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <g transform="translate(256 256)">
    <circle cx="0" cy="0" r="160" fill="none" stroke="url(#fg)" stroke-width="14" stroke-linecap="round" stroke-dasharray="60 220" transform="rotate(-90)">
      <animateTransform attributeName="transform" type="rotate" from="-90 0 0" to="270 0 0" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="100" fill="none" stroke="url(#fg)" stroke-width="10" stroke-linecap="round" stroke-dasharray="40 220" transform="rotate(180)">
      <animateTransform attributeName="transform" type="rotate" from="180 0 0" to="-180 0 0" dur="4s" repeatCount="indefinite"/>
    </circle>
    <text x="0" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="120" font-weight="900" fill="url(#fg)">G</text>
  </g>
  <g transform="translate(80 470)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#fff" opacity="0.85">Global Market Watch</text>
  </g>
</svg>
